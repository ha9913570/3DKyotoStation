name: Build App windows

on:
  workflow_dispatch: {}

defaults:
  run:
    shell: bash

jobs:
  build-windows:
    name: Build for StandaloneWindows64
    runs-on: [self-hosted, Windows]
    env:
      UNITY_PATH: 'C:/Program Files/Unity/Hub/Editor/6000.3.22f1/Editor/Unity.exe'
      TARGET_PLATFORM: StandaloneWindows64
      BUILD_METHOD: BuildApp.Build
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          clean: false
          submodules: recursive

      - name: Run Build
        run: |
          "$UNITY_PATH" -batchmode -quit -projectPath . \
            -buildTarget "$TARGET_PLATFORM" \
            -executeMethod "$BUILD_METHOD" \
            -logFile -

      - name: Upload App
        uses: actions/upload-artifact@v4
        with:
          name: App_Develop_${{ env.TARGET_PLATFORM }}
          path: Builds/App/
          retention-days: 7
          if-no-files-found: error
